[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "artifactfit-mm"
version = "0.1.0"
description = "Contract-guided, resource-bounded preflight for multimedia research artifacts"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"
authors = [{name = "ArtifactFit-MM Contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "nvidia-ml-py>=12.560,<14",
  "packaging>=24.2,<27",
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-psutil>=6.1",
  "types-pyyaml>=6.0",
]

[project.scripts]
artifactfit = "artifactfit_mm.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactfit_mm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires a CUDA-capable GPU",
  "integration: bounded integration test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests/fixtures/programs/"]

